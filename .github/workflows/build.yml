# Builds TerminalRunner into a single, self-contained Windows exe.
#
#  - Every push to main, every pull request and manual runs ("Run workflow" button):
#      the exe is uploaded as a build artifact you can download from the run's summary page.
#  - Pushing a version tag such as v1.0.0:
#      the exe is also attached to a GitHub Release with that version.
#
# Only GitHub's own actions are used (checkout, setup-dotnet, upload-artifact);
# the release is created with the GitHub CLI that is pre-installed on the runner.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Write access is only needed to create releases on tag builds.
permissions:
  contents: write

env:
  PROJECT_PATH: src/TerminalRunner/TerminalRunner.csproj
  RUNTIME_IDENTIFIER: win-x64
  PUBLISH_DIRECTORY: publish

jobs:
  build:
    runs-on: windows-latest

    # Git Bash is available on Windows runners, so the steps below use bash syntax.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # On a tag like "v1.2.3" the exe gets version 1.2.3; other builds keep the project default.
      - name: Work out the version number
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      # Same build as a developer would do locally; warnings already fail the build (TreatWarningsAsErrors).
      - name: Build
        run: dotnet build "$PROJECT_PATH" --configuration Release

      # Self-contained single file: the exe runs on any 64-bit Windows without installing .NET.
      - name: Publish single-file exe
        run: |
          version_arguments=()
          if [[ -n "${{ steps.version.outputs.number }}" ]]; then
            version_arguments=("-p:Version=${{ steps.version.outputs.number }}")
          fi

          dotnet publish "$PROJECT_PATH" \
            --configuration Release \
            --runtime "$RUNTIME_IDENTIFIER" \
            --self-contained true \
            --output "$PUBLISH_DIRECTORY" \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            "${version_arguments[@]}"

          cp README.md "$PUBLISH_DIRECTORY/"
          ls -la "$PUBLISH_DIRECTORY"

      # Quick smoke test: the exe starts and prints its help text.
      - name: Smoke test the exe
        run: ./$PUBLISH_DIRECTORY/TerminalRunner.exe --help

      - name: Upload the exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalRunner-${{ env.RUNTIME_IDENTIFIER }}
          path: ${{ env.PUBLISH_DIRECTORY }}/
          if-no-files-found: error

      # Only for version tags: create a GitHub Release with the exe attached.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$PUBLISH_DIRECTORY/TerminalRunner.exe" \
            --title "TerminalRunner $GITHUB_REF_NAME" \
            --generate-notes
